
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal dos Alunos</title>
<style>
body{
background:#09090f;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:0;
}
.container{
max-width:1200px;
margin:auto;
padding:80px 24px;
}
h1{
font-size:3rem;
margin-bottom:20px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:24px;
}
.card{
background:rgba(255,255,255,.04);
border-radius:24px;
padding:28px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 40px rgba(110,90,255,.12);
}
</style>
</head>
<body>
<div class="container">
<h1>Portal dos Alunos</h1>

<div class="grid">
<div class="card">
<h2>Materiais organizados</h2>
<p>Atividades, links, vídeos, PDFs e conteúdos organizados de forma clara</p>
</div>

<div class="card">
<h2>Acompanhamento</h2>
<p>Histórico das aulas, progresso e continuidade do desenvolvimento no inglês</p>
</div>

<div class="card">
<h2>Atividades</h2>
<p>Shadowing, listening, speaking e atividades direcionadas ao perfil do aluno</p>
</div>
</div>

</div>
</body>
</html>
