name: Spatial Pulse Cache Bust Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spatial-pulse-cache-bust-once.yml'

permissions:
  contents: write

jobs:
  patch-cache-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/spatial-pulse-cache-bust-20260818
          fetch-depth: 0
      - name: Align Spatial Pulse QA on generated branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/site-v3-qa.yml')
          text=path.read_text(encoding='utf-8')
          replacements={
              "cache_version='20260817-2350-orbit-b1'":"cache_version='20260818-0115-pulse-b1'",
              'Spatial Frame Orbit':'Spatial Pulse',
              'Spatial Orbit':'Spatial Pulse',
              "'production b — spatial frame orbit'":"'spatial pulse — production motion engine'",
              "['orbit-frame','orbit-rail','orbit-node','orbit-halo']":"['pulse-ring','pulse-plane','pulse-axis','pulse-core','pulse-corner']",
              'cache-busting do CSS/JS Spatial Pulse ausente ou inconsistente':'cache-busting do CSS/JS Spatial Pulse ausente ou inconsistente',
              'assets de produção Spatial Pulse não estão ambos carregados':'assets de produção Spatial Pulse não estão ambos carregados',
              'proteção contra overflow horizontal do orbit ausente':'proteção contra overflow horizontal da Spatial Pulse ausente',
          }
          for old,new in replacements.items():
              text=text.replace(old,new)
          required=[
              "cache_version='20260818-0115-pulse-b1'",
              "'spatial pulse — production motion engine'",
              "['pulse-ring','pulse-plane','pulse-axis','pulse-core','pulse-corner']",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'QA alignment marker missing after rewrite: {marker}')
          path.write_text(text,encoding='utf-8')
          print('QA ALIGNMENT OK — Site V3 QA now validates Spatial Pulse and the new cache key')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/site-v3-qa.yml
          git commit -m 'Align static QA with Spatial Pulse cache key'
          git push origin HEAD:agent/spatial-pulse-cache-bust-20260818
