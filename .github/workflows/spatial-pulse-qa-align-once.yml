name: Spatial Pulse QA Align Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spatial-pulse-qa-align-once.yml'

permissions:
  contents: write

jobs:
  align-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/spatial-pulse-cache-bust-20260818
          fetch-depth: 0
      - name: Align static QA with Spatial Pulse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/site-v3-qa.yml')
          text=path.read_text(encoding='utf-8')
          text=text.replace("cache_version='20260817-2350-orbit-b1'","cache_version='20260818-0115-pulse-b1'")
          text=text.replace('Spatial Frame Orbit','Spatial Pulse')
          text=text.replace('Spatial Orbit','Spatial Pulse')
          text=text.replace("'production b — spatial frame orbit'","'spatial pulse — production motion engine'")
          text=text.replace("['orbit-frame','orbit-rail','orbit-node','orbit-halo']","['pulse-ring','pulse-plane','pulse-axis','pulse-core','pulse-corner']")
          text=text.replace('implementação oficial da Opção B não identificada','implementação oficial da Spatial Pulse não identificada')
          text=text.replace('proteção contra overflow horizontal do orbit ausente','proteção contra overflow horizontal da Spatial Pulse ausente')
          required=[
              "cache_version='20260818-0115-pulse-b1'",
              "'spatial pulse — production motion engine'",
              "['pulse-ring','pulse-plane','pulse-axis','pulse-core','pulse-corner']",
              'Spatial Pulse must preserve one sharp photo plane',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'QA alignment marker missing: {marker}')
          if "cache_version='20260817-2350-orbit-b1'" in text:
              raise SystemExit('old cache key still present in static QA')
          path.write_text(text,encoding='utf-8')
          print('STATIC QA ALIGNMENT OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/site-v3-qa.yml
          git commit -m 'Align static QA with Spatial Pulse'
          git push origin HEAD:agent/spatial-pulse-cache-bust-20260818
