name: Site V3 Production Smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/site-v3-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-v3-production-smoke
  cancel-in-progress: true

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for GitHub Pages to publish Spatial Pulse
        shell: python
        run: |
          import re
          import sys
          import time
          import urllib.request

          base = 'https://teachermarcosvinifs.github.io/Landing-page-1/'
          version = '20260817-2350-orbit-b1'

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Landing-page-1-spatial-pulse-smoke/1.0',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.status, response.read().decode('utf-8', errors='replace')

          last_error = None
          for attempt in range(1, 19):
              nonce = str(int(time.time() * 1000))
              try:
                  css_status, css = fetch(base + 'assets/professional-motion-v3.css?v=' + version + '&pulse-smoke=' + nonce)
                  js_status, js = fetch(base + 'assets/professional-motion-v3.js?v=' + version + '&pulse-smoke=' + nonce)
                  css_low = css.lower()
                  js_low = js.lower()
                  css_ready = all(marker in css_low for marker in [
                      'spatial pulse — production motion engine',
                      '.pulse-ring', '.pulse-plane', '.pulse-axis', '.pulse-core', '.pulse-corner',
                  ])
                  js_ready = all(marker in js_low for marker in [
                      'spatial pulse', 'pulse-ring', 'pulse-plane', 'pulse-axis', 'pulse-core', 'pulse-corner',
                      'assertbaseintegrity', 'pulseautonomous', 'spatialpulsegeo',
                  ])
                  if css_status == 200 and js_status == 200 and css_ready and js_ready:
                      print(f'Spatial Pulse production detected on attempt {attempt}')
                      break
                  last_error = f'CSS={css_status}/{css_ready}; JS={js_status}/{js_ready}'
              except Exception as exc:
                  last_error = repr(exc)
              print(f'Attempt {attempt}/18: Spatial Pulse not live yet — {last_error}')
              time.sleep(10)
          else:
              print('PRODUCTION SMOKE FAILED: GitHub Pages did not expose Spatial Pulse within 3 minutes')
              print('Last observation:', last_error)
              sys.exit(1)

      - name: Verify live Spatial Pulse routes and invariants
        shell: python
        run: |
          import re
          import sys
          import time
          import urllib.request

          base = 'https://teachermarcosvinifs.github.io/Landing-page-1/'
          version = '20260817-2350-orbit-b1'

          def fetch(path):
              separator = '&' if '?' in path else '?'
              url = base + path + separator + 'pulse-smoke=' + str(int(time.time() * 1000))
              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Landing-page-1-spatial-pulse-smoke/1.0',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.status, response.read().decode('utf-8', errors='replace')

          routes = {
              '': ['Professor de Inglês para adolescentes e adultos', 'Adquira fluência com acompanhamento profissional e estrutura completa'],
              'como-funciona.html': ['Como funcionam as aulas', 'assets/site-v3-black.css'],
              'portal-dos-alunos.html': ['Portal dos Alunos', 'Materiais e atividades em um só lugar'],
              'ingles-para-devs.html': ['Inglês para desenvolvedores e programadores', 'Participar de calls e reuniões internacionais', 'Trabalhar com equipes e empresas internacionais'],
              'ingles-para-compliance.html': ['Inglês para profissionais de Compliance', 'Precisão profissional', 'Linguagem da área'],
              'qual-formato.html': ['Individual, dupla, trio ou grupo?', 'Informe seu nível, objetivo, formato e carga semanal', 'Os valores, planos e cargas horárias são informados diretamente por mim pelo WhatsApp'],
              'sitemap.xml': ['ingles-para-devs.html', 'ingles-para-compliance.html'],
              'robots.txt': ['Sitemap: https://teachermarcosvinifs.github.io/Landing-page-1/sitemap.xml'],
          }

          errors = []
          fetched = {}
          for path, markers in routes.items():
              try:
                  status, body = fetch(path)
                  fetched[path] = body
                  if status != 200:
                      errors.append(f'{path or "home"}: HTTP {status}')
                      continue
                  for marker in markers:
                      if marker.casefold() not in body.casefold():
                          errors.append(f'{path or "home"}: marker ausente -> {marker}')
                  if path == 'qual-formato.html' and 'R$' in body:
                      errors.append('qual-formato.html: valor monetário público detectado')
              except Exception as exc:
                  errors.append(f'{path or "home"}: {exc!r}')

          expected_targets = {'': 2, 'ingles-para-devs.html': 1, 'ingles-para-compliance.html': 1}
          for path, expected in expected_targets.items():
              body = fetched.get(path, '')
              count = body.count('spatial-orbit-target')
              if count != expected:
                  errors.append(f'{path or "home"}: esperado {expected} alvo(s) de movimento; encontrado {count}')
              if body.count(version) != 2:
                  errors.append(f'{path or "home"}: cache-busting de CSS/JS inconsistente')

          try:
              css_status, css = fetch('assets/professional-motion-v3.css?v=' + version)
              js_status, js = fetch('assets/professional-motion-v3.js?v=' + version)
              if css_status != 200: errors.append(f'CSS HTTP {css_status}')
              if js_status != 200: errors.append(f'JS HTTP {js_status}')
              css_low = css.lower()
              js_low = js.lower()
              css_compact = re.sub(r'\s+', '', css_low)

              for marker in ['spatial pulse — production motion engine', '.pulse-ring', '.pulse-plane', '.pulse-axis', '.pulse-core', '.pulse-corner']:
                  if marker not in css_low: errors.append(f'live CSS Spatial Pulse marker ausente -> {marker}')
              if '#ingles-profissional,.professional-context-hero{overflow-x:clip}' not in css_compact:
                  errors.append('live CSS: contenção horizontal da Spatial Pulse ausente')
              if 'prefers-reduced-motion:reduce' not in css_compact:
                  errors.append('live CSS: reduced-motion ausente')

              for marker in ['spatial pulse', 'pulse-ring', 'pulse-plane', 'pulse-axis', 'pulse-core', 'pulse-corner', 'assertbaseintegrity', 'pulseautonomous', 'spatialpulsegeo']:
                  if marker not in js_low: errors.append(f'live JS Spatial Pulse marker ausente -> {marker}')

              if re.search(r'blur\s*\(', css, re.I) or re.search(r'blur\s*\(', js, re.I):
                  errors.append('blur detectado nos assets live')
              if 'clonenode' in js_low:
                  errors.append('cloneNode detectado nos assets live')
              if re.search(r'pointer(move|enter|leave)', js, re.I):
                  errors.append('dependência de pointer detectada nos assets live')
              if "figure.queryselectorall('img').length!==1" not in js_low:
                  errors.append('proteção contra imagem duplicada/ghosting ausente')
              if 'opacity<.92' not in js_low:
                  errors.append('proteção contra transparência significativa ausente')
          except Exception as exc:
              errors.append(f'assets live: {exc!r}')

          if errors:
              print('SPATIAL PULSE PRODUCTION CHECK FAILED')
              for error in errors:
                  print('-', error)
              sys.exit(1)

          print('PRODUCTION SMOKE OK — GitHub Pages serves Spatial Pulse on exactly four professional photographs with one sharp image plane, reduced-motion support and no horizontal overflow')
