name: Site V3 Functional QA

on:
  push:
    branches: [main, site-v3-redesign]
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/site-v3-motion.js'
      - '.github/workflows/site-v3-functional.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/site-v3-motion.js'
      - '.github/workflows/site-v3-functional.yml'

permissions:
  contents: read

jobs:
  format-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site-v3-functional-http.log 2>&1 &
          sleep 2
      - name: Test format finder, direct attribution and contact flows
        run: |
          cat > functional-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const choose = async id => page.locator(`label[for="${id}"]`).click();
          const whatsAppText = href => new URL(href).searchParams.get('text') || '';

          await page.goto('http://127.0.0.1:8000/qual-formato.html?src=ig-formatos',{waitUntil:'networkidle'});
          assert.equal(await page.locator('#revealPrice').count(),0,'Price reveal control must not exist');
          assert.equal(await page.locator('#priceReveal').count(),0,'Price reveal area must not exist');
          assert.ok(!(await page.locator('body').innerText()).includes('R$'),'Format tool must not expose monetary values');
          await choose('l3'); await choose('g2'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          assert.equal(await page.locator('#resultTitle').textContent(), 'Aulas conversacionais (B1+) · Individual');
          assert.ok((await page.locator('#result .notice').textContent()).includes('Os valores, planos e cargas horárias são informados diretamente por mim pelo WhatsApp'));
          const waHref = await page.locator('#waResult').getAttribute('href');
          assert.ok(whatsAppText(waHref).includes('uma publicação no Instagram sobre os formatos das aulas'), 'Format result WhatsApp must preserve ?src attribution');
          assert.ok(whatsAppText(waHref).includes('consultar valores, planos e cargas horárias'), 'Result WhatsApp must ask the professor for commercial details');

          await page.goto('http://127.0.0.1:8000/qual-formato.html',{waitUntil:'networkidle'});
          await choose('l1'); await choose('g2'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          assert.equal(await page.locator('#resultTitle').textContent(), 'Ensino regular · Individual');
          const copy = (await page.locator('#resultCopy').textContent()).toLowerCase();
          assert.ok(copy.includes('modalidade conversacional começa a partir do b1'));

          await page.goto('http://127.0.0.1:8000/qual-formato.html',{waitUntil:'networkidle'});
          await choose('l4'); await choose('g4'); await choose('f4'); await choose('m4');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          const facts = await page.locator('#facts').innerText();
          assert.ok(facts.includes('Ainda não definida'));
          assert.ok(!(await page.locator('body').innerText()).includes('R$'),'Unknown load must not reveal or invent a price');

          await page.goto('http://127.0.0.1:8000/index.html?src=ig-portal',{waitUntil:'networkidle'});
          const directWa = await page.locator('.hero a[href^="https://wa.me/5592985273076"]').first().getAttribute('href');
          assert.ok(whatsAppText(directWa).includes('uma publicação no Instagram sobre o Portal dos Alunos'), 'Direct homepage WhatsApp must preserve ?src attribution');
          assert.equal(await page.locator('a[href^="mailto:"]').count(), 0, 'Homepage must not expose email');
          assert.ok(await page.locator('.hero a[href*="docs.google.com/forms"]').count() >= 1, 'Homepage must expose the form alongside WhatsApp');
          assert.ok((await page.locator('.faq').innerText()).includes('Os valores, planos e cargas horárias são informados diretamente por mim pelo WhatsApp'),'Homepage FAQ must direct pricing to WhatsApp');

          const formatsHref = await page.locator('a[href*="qual-formato.html"]').first().getAttribute('href');
          const formatsUrl = new URL(formatsHref,page.url());
          assert.equal(formatsUrl.searchParams.get('src'),'ig-portal','Internal Formats link must preserve source');
          await page.goto(formatsUrl.href,{waitUntil:'networkidle'});
          await choose('l3'); await choose('g1'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          const navigatedWa = await page.locator('#waResult').getAttribute('href');
          assert.ok(whatsAppText(navigatedWa).includes('uma publicação no Instagram sobre o Portal dos Alunos'), 'Source must survive home → formats → result WhatsApp');

          await page.goto('http://127.0.0.1:8000/index.html?src=unknown-source',{waitUntil:'networkidle'});
          const unknownWa = await page.locator('.hero a[href^="https://wa.me/5592985273076"]').first().getAttribute('href');
          assert.ok(!whatsAppText(unknownWa).includes('Vi esta página a partir de'), 'Unknown source must not create invented attribution');
          const unknownFormats = await page.locator('a[href*="qual-formato.html"]').first().getAttribute('href');
          const unknownFormatsUrl = new URL(unknownFormats,page.url());
          assert.ok(!unknownFormatsUrl.searchParams.has('src'), 'Unknown source must not propagate through internal links');

          await browser.close();
          console.log('FUNCTIONAL QA OK — B1+ rule, no public prices, direct WhatsApp consultation, contact flows and end-to-end source attribution verified');
          EOF
          node functional-check.mjs
