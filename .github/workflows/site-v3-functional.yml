name: Site V3 Functional QA

on:
  push:
    branches: [main, site-v3-redesign]
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/site-v3-motion.js'
      - 'assets/professional-visuals.css'
      - 'assets/professional-motion-v3.js'
      - 'assets/professional-motion-v3.css'
      - '.github/workflows/site-v3-functional.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/site-v3-motion.js'
      - 'assets/professional-visuals.css'
      - 'assets/professional-motion-v3.js'
      - 'assets/professional-motion-v3.css'
      - '.github/workflows/site-v3-functional.yml'

permissions:
  contents: read

jobs:
  format-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site-v3-functional-http.log 2>&1 &
          sleep 2
      - name: Test format finder, contact flows and Spatial Frame Orbit
        run: |
          cat > functional-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1280,height:900}});
          const page = await context.newPage();
          const choose = async id => page.locator(`label[for="${id}"]`).click();
          const whatsAppText = href => new URL(href).searchParams.get('text') || '';
          const onePixelPng=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
          await page.route('https://images.pexels.com/**',route=>route.fulfill({status:200,contentType:'image/png',body:onePixelPng}));

          await page.goto('http://127.0.0.1:8000/qual-formato.html?src=ig-formatos',{waitUntil:'networkidle'});
          assert.equal(await page.locator('#revealPrice').count(),0,'Price reveal control must not exist');
          assert.equal(await page.locator('#priceReveal').count(),0,'Price reveal area must not exist');
          assert.ok(!(await page.locator('body').innerText()).includes('R$'),'Format tool must not expose monetary values');
          await choose('l3'); await choose('g2'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          assert.equal(await page.locator('#resultTitle').textContent(), 'Aulas conversacionais (B1+) · Individual');
          assert.ok((await page.locator('#result .notice').textContent()).includes('Os valores, planos e cargas horárias são informados diretamente por mim pelo WhatsApp'));
          const waHref = await page.locator('#waResult').getAttribute('href');
          assert.ok(whatsAppText(waHref).includes('uma publicação no Instagram sobre os formatos das aulas'), 'Format result WhatsApp must preserve ?src attribution');
          assert.ok(whatsAppText(waHref).includes('consultar valores, planos e cargas horárias'), 'Result WhatsApp must ask the professor for commercial details');

          await page.goto('http://127.0.0.1:8000/qual-formato.html',{waitUntil:'networkidle'});
          await choose('l1'); await choose('g2'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          assert.equal(await page.locator('#resultTitle').textContent(), 'Ensino regular · Individual');
          const copy = (await page.locator('#resultCopy').textContent()).toLowerCase();
          assert.ok(copy.includes('modalidade conversacional começa a partir do b1'));

          await page.goto('http://127.0.0.1:8000/qual-formato.html',{waitUntil:'networkidle'});
          await choose('l4'); await choose('g4'); await choose('f4'); await choose('m4');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          const facts = await page.locator('#facts').innerText();
          assert.ok(facts.includes('Ainda não definida'));
          assert.ok(!(await page.locator('body').innerText()).includes('R$'),'Unknown load must not reveal or invent a price');

          await page.goto('http://127.0.0.1:8000/index.html?src=ig-portal',{waitUntil:'networkidle'});
          const directWa = await page.locator('.hero a[href^="https://wa.me/5592985273076"]').first().getAttribute('href');
          assert.ok(whatsAppText(directWa).includes('uma publicação no Instagram sobre o Portal dos Alunos'), 'Direct homepage WhatsApp must preserve ?src attribution');
          assert.equal(await page.locator('a[href^="mailto:"]').count(), 0, 'Homepage must not expose email');
          assert.ok(await page.locator('.hero a[href*="docs.google.com/forms"]').count() >= 1, 'Homepage must expose the form alongside WhatsApp');
          const pricingFaq = page.locator('.faq details').filter({hasText:'Como consulto os valores?'});
          await pricingFaq.locator('summary').click();
          assert.ok((await pricingFaq.innerText()).includes('Os valores, planos e cargas horárias são informados diretamente por mim pelo WhatsApp'),'Homepage FAQ must direct pricing to WhatsApp after opening the answer');

          const formatsHref = await page.locator('a[href*="qual-formato.html"]').first().getAttribute('href');
          const formatsUrl = new URL(formatsHref,page.url());
          assert.equal(formatsUrl.searchParams.get('src'),'ig-portal','Internal Formats link must preserve source');
          await page.goto(formatsUrl.href,{waitUntil:'networkidle'});
          await choose('l3'); await choose('g1'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form => form.requestSubmit());
          await page.locator('#result.show').waitFor();
          const navigatedWa = await page.locator('#waResult').getAttribute('href');
          assert.ok(whatsAppText(navigatedWa).includes('uma publicação no Instagram sobre o Portal dos Alunos'), 'Source must survive home → formats → result WhatsApp');

          await page.goto('http://127.0.0.1:8000/index.html?src=unknown-source',{waitUntil:'networkidle'});
          const unknownWa = await page.locator('.hero a[href^="https://wa.me/5592985273076"]').first().getAttribute('href');
          assert.ok(!whatsAppText(unknownWa).includes('Vi esta página a partir de'), 'Unknown source must not create invented attribution');
          const unknownFormats = await page.locator('a[href*="qual-formato.html"]').first().getAttribute('href');
          const unknownFormatsUrl = new URL(unknownFormats,page.url());
          assert.ok(!unknownFormatsUrl.searchParams.has('src'), 'Unknown source must not propagate through internal links');

          // Production Option B guardrails: autonomous, one sharp photo plane, finite spatial geometry.
          const motionCss=fs.readFileSync('assets/professional-motion-v3.css','utf8');
          const motionJs=fs.readFileSync('assets/professional-motion-v3.js','utf8');
          assert.ok(!/blur\s*\(/i.test(motionCss),'Spatial Frame Orbit CSS must never blur the photograph');
          assert.ok(!/blur\s*\(/i.test(motionJs),'Spatial Frame Orbit JS must never blur the photograph');
          assert.ok(!/cloneNode/i.test(motionJs),'Spatial Frame Orbit must never duplicate the photograph');
          assert.ok(!/pointer(move|enter|leave)/i.test(motionJs),'Spatial Frame Orbit must not depend on pointer interaction');
          assert.ok(motionJs.includes('orbit-frame') && motionJs.includes('orbit-rail') && motionJs.includes('orbit-node') && motionJs.includes('orbit-halo'),'Spatial geometry primitives must exist');
          assert.ok(motionCss.replace(/\s/g,'').includes('prefers-reduced-motion:reduce'),'Production motion must respect reduced motion');
          assert.ok(motionJs.includes('assertBaseIntegrity'),'Runtime photograph-integrity guard must exist');

          const motionCases=[
            {name:'homepage',path:'/index.html',selector:'#ingles-profissional .spatial-orbit-target',count:2,scroll:'#ingles-profissional'},
            {name:'dev',path:'/ingles-para-devs.html',selector:'.professional-visual.spatial-orbit-target',count:1},
            {name:'compliance',path:'/ingles-para-compliance.html',selector:'.professional-visual.spatial-orbit-target',count:1}
          ];

          for(const test of motionCases){
            await page.goto('http://127.0.0.1:8000'+test.path,{waitUntil:'domcontentloaded'});
            if(test.scroll)await page.locator(test.scroll).scrollIntoViewIfNeeded();
            await page.waitForFunction(({selector,count})=>{
              const nodes=[...document.querySelectorAll(selector)];
              return nodes.length===count && nodes.every(el=>el.dataset.spatialOrbit==='running');
            },{selector:test.selector,count:test.count});
            await page.waitForTimeout(320);

            const during=await page.locator(test.selector).evaluateAll(nodes=>nodes.map(el=>{
              const img=el.querySelector(':scope > img');
              const imgCs=getComputedStyle(img);
              return {
                autonomous:el.dataset.orbitAutonomous,
                imgs:el.querySelectorAll('img').length,
                frames:el.querySelectorAll('.orbit-frame').length,
                rails:el.querySelectorAll('.orbit-rail').length,
                nodes:el.querySelectorAll('.orbit-node').length,
                halos:el.querySelectorAll('.orbit-halo').length,
                filter:imgCs.filter,
                opacity:Number.parseFloat(imgCs.opacity)
              };
            }));
            for(const state of during){
              assert.equal(state.autonomous,'true',`${test.name}: effect must be autonomous`);
              assert.equal(state.imgs,1,`${test.name}: exactly one photograph must exist`);
              assert.equal(state.frames,3,`${test.name}: three orbital frames must be perceptible`);
              assert.equal(state.rails,2,`${test.name}: two rails must exist during orbit`);
              assert.equal(state.nodes,2,`${test.name}: two nodes must exist during orbit`);
              assert.equal(state.halos,1,`${test.name}: one temporary halo must exist during orbit`);
              assert.equal(state.filter,'none',`${test.name}: photograph must stay filter-free`);
              assert.ok(state.opacity>=.92,`${test.name}: photograph opacity must stay high`);
            }
            const overflowDuring=await page.evaluate(()=>Math.max(document.body.scrollWidth,document.documentElement.scrollWidth)-window.innerWidth);
            assert.ok(overflowDuring<=2,`${test.name}: orbit must not create horizontal overflow`);

            await page.waitForFunction(({selector,count})=>{
              const nodes=[...document.querySelectorAll(selector)];
              return nodes.length===count && nodes.every(el=>el.dataset.spatialOrbit==='done');
            },{selector:test.selector,count:test.count});
            const finalStates=await page.locator(test.selector).evaluateAll(nodes=>nodes.map(el=>{
              const img=el.querySelector(':scope > img');
              const imgCs=getComputedStyle(img);
              return {
                integrity:el.dataset.orbitIntegrity,
                imgs:el.querySelectorAll('img').length,
                geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length,
                frameTransform:getComputedStyle(el).transform,
                filter:imgCs.filter,
                opacity:Number.parseFloat(imgCs.opacity)
              };
            }));
            for(const state of finalStates){
              assert.equal(state.integrity,'passed',`${test.name}: integrity guard must pass`);
              assert.equal(state.imgs,1,`${test.name}: final photograph must remain unique`);
              assert.equal(state.geometry,0,`${test.name}: temporary geometry must be removed`);
              assert.equal(state.frameTransform,'none',`${test.name}: frame must stabilize cleanly`);
              assert.equal(state.filter,'none',`${test.name}: final photograph must be sharp`);
              assert.equal(state.opacity,1,`${test.name}: final photograph must be fully opaque`);
            }
            const overflowFinal=await page.evaluate(()=>Math.max(document.body.scrollWidth,document.documentElement.scrollWidth)-window.innerWidth);
            assert.ok(overflowFinal<=2,`${test.name}: final page must not overflow horizontally`);
          }

          // Pointer movement after completion must not restart/tilt the production effect.
          await page.goto('http://127.0.0.1:8000/ingles-para-devs.html',{waitUntil:'domcontentloaded'});
          const devMedia=page.locator('.professional-visual.spatial-orbit-target');
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.spatialOrbit==='done');
          const beforePointer=await devMedia.evaluate(el=>({frame:getComputedStyle(el).transform,image:getComputedStyle(el.querySelector(':scope > img')).transform,filter:getComputedStyle(el.querySelector(':scope > img')).filter,state:el.dataset.spatialOrbit}));
          const box=await devMedia.boundingBox();
          if(box){await page.mouse.move(box.x+box.width*.8,box.y+box.height*.2);await page.waitForTimeout(450);}
          const afterPointer=await devMedia.evaluate(el=>({frame:getComputedStyle(el).transform,image:getComputedStyle(el.querySelector(':scope > img')).transform,filter:getComputedStyle(el.querySelector(':scope > img')).filter,state:el.dataset.spatialOrbit}));
          assert.deepEqual(afterPointer,beforePointer,'Mouse movement must not restart, tilt or soften the finished Spatial Frame Orbit');

          // Fail-safe QA: forced blur and forced transparency must abort the orbit and restore the photo.
          await page.goto('http://127.0.0.1:8000/ingles-para-devs.html',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.spatialOrbit==='running');
          await page.locator('.professional-visual.spatial-orbit-target > img').evaluate(img=>img.style.setProperty('filter','blur(2px)','important'));
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.orbitIntegrity==='failed');
          const blurRecovery=await page.locator('.professional-visual.spatial-orbit-target').evaluate(el=>({state:el.dataset.spatialOrbit,integrity:el.dataset.orbitIntegrity,filter:getComputedStyle(el.querySelector(':scope > img')).filter,opacity:getComputedStyle(el.querySelector(':scope > img')).opacity,geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length}));
          assert.deepEqual(blurRecovery,{state:'done',integrity:'failed',filter:'none',opacity:'1',geometry:0},'Blur guard must fail closed and restore a clean photograph');

          await page.goto('http://127.0.0.1:8000/ingles-para-compliance.html',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.spatialOrbit==='running');
          await page.locator('.professional-visual.spatial-orbit-target > img').evaluate(img=>img.style.setProperty('opacity','.5','important'));
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.orbitIntegrity==='failed');
          const opacityRecovery=await page.locator('.professional-visual.spatial-orbit-target').evaluate(el=>({state:el.dataset.spatialOrbit,integrity:el.dataset.orbitIntegrity,filter:getComputedStyle(el.querySelector(':scope > img')).filter,opacity:getComputedStyle(el.querySelector(':scope > img')).opacity,geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length}));
          assert.deepEqual(opacityRecovery,{state:'done',integrity:'failed',filter:'none',opacity:'1',geometry:0},'Opacity guard must fail closed and restore a clean photograph');

          // Reduced motion: no transient geometry, photo remains normal.
          await page.emulateMedia({reducedMotion:'reduce'});
          await page.goto('http://127.0.0.1:8000/ingles-para-devs.html',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.spatialOrbit==='done');
          const reduced=await page.locator('.professional-visual.spatial-orbit-target').evaluate(el=>({integrity:el.dataset.orbitIntegrity,geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length,filter:getComputedStyle(el.querySelector(':scope > img')).filter,opacity:getComputedStyle(el.querySelector(':scope > img')).opacity}));
          assert.deepEqual(reduced,{integrity:'passed',geometry:0,filter:'none',opacity:'1'},'Reduced-motion mode must skip transient geometry and keep the photograph clean');

          await context.close();
          await browser.close();
          console.log('FUNCTIONAL QA OK — commercial rules, attribution and Spatial Frame Orbit verified on all four production photographs');
          EOF
          node functional-check.mjs