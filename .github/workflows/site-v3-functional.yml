name: Site V3 Functional QA

on:
  push:
    branches: [main, site-v3-redesign]
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'contato.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/site-v3-motion.js'
      - 'assets/professional-visuals.css'
      - 'assets/professional-motion-v3.js'
      - 'assets/professional-motion-v3.css'
      - '.github/workflows/site-v3-functional.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'contato.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/site-v3-motion.js'
      - 'assets/professional-visuals.css'
      - 'assets/professional-motion-v3.js'
      - 'assets/professional-motion-v3.css'
      - '.github/workflows/site-v3-functional.yml'

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site-v3-functional-http.log 2>&1 &
          sleep 2
      - name: Test commercial flow, attribution and Spatial Frame Orbit
        run: |
          cat > functional-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const choose=async id=>page.locator(`label[for="${id}"]`).click();
          const waText=href=>new URL(href).searchParams.get('text')||'';
          const pixel=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
          await page.route('https://images.pexels.com/**',route=>route.fulfill({status:200,contentType:'image/png',body:pixel}));

          // Format finder: no public price, B1+ gate and source attribution.
          await page.goto('http://127.0.0.1:8000/qual-formato.html?src=ig-formatos',{waitUntil:'networkidle'});
          assert.equal(await page.locator('#revealPrice').count(),0,'Price reveal control must not exist');
          assert.equal(await page.locator('#priceReveal').count(),0,'Price reveal area must not exist');
          assert.ok(!(await page.locator('body').innerText()).includes('R$'),'Format tool must not expose monetary values');
          await choose('l3'); await choose('g2'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form=>form.requestSubmit());
          await page.locator('#result.show').waitFor();
          assert.equal(await page.locator('#resultTitle').textContent(),'Aulas conversacionais (B1+) · Individual');
          const formatWa=await page.locator('#waResult').getAttribute('href');
          assert.ok(waText(formatWa).includes('uma publicação no Instagram sobre os formatos das aulas'),'Format result must preserve source');
          assert.ok(waText(formatWa).includes('consultar valores, planos e cargas horárias'),'Format result must ask professor for commercial details');

          await page.goto('http://127.0.0.1:8000/qual-formato.html',{waitUntil:'networkidle'});
          await choose('l1'); await choose('g2'); await choose('f1'); await choose('m1');
          await page.locator('#fitForm').evaluate(form=>form.requestSubmit());
          await page.locator('#result.show').waitFor();
          assert.equal(await page.locator('#resultTitle').textContent(),'Ensino regular · Individual');
          assert.ok((await page.locator('#resultCopy').textContent()).toLowerCase().includes('modalidade conversacional começa a partir do b1'));

          // Homepage: WhatsApp + commercial intake, never the pedagogical Google Form.
          await page.goto('http://127.0.0.1:8000/index.html?src=ig-portal',{waitUntil:'networkidle'});
          const directWa=await page.locator('.hero a[href^="https://wa.me/5592985273076"]').first().getAttribute('href');
          assert.ok(waText(directWa).includes('uma publicação no Instagram sobre o Portal dos Alunos'),'Homepage WhatsApp must preserve source');
          assert.equal(await page.locator('a[href^="mailto:"]').count(),0,'Homepage must not expose email');
          assert.equal(await page.locator('a[href*="docs.google.com/forms"]').count(),0,'Pedagogical Google Form must not remain in acquisition DOM after guard runs');
          const intakeHref=await page.locator('.hero a[href*="contato.html"]').first().getAttribute('href');
          assert.ok(intakeHref,'Homepage must expose commercial contact intake alongside WhatsApp');
          const intakeUrl=new URL(intakeHref,page.url());
          assert.equal(intakeUrl.searchParams.get('src'),'ig-portal','Contact intake must preserve source');

          await page.goto(intakeUrl.href,{waitUntil:'networkidle'});
          assert.equal(await page.locator('#contact-intake-form').count(),1,'Commercial contact intake must load');
          for(const field of ['#name','#level','#goal','#format'])assert.equal(await page.locator(field).count(),1,`Missing contact field ${field}`);
          assert.equal(await page.locator('form[action]').count(),0,'Contact intake must not submit to an external backend');
          assert.ok((await page.locator('body').innerText()).includes('não são enviadas para um banco de dados'),'Contact page must state local-only handling');

          // Unknown sources fail closed; known Reddit source survives into contact page.
          await page.goto('http://127.0.0.1:8000/index.html?src=unknown-source',{waitUntil:'networkidle'});
          const unknownWa=await page.locator('.hero a[href^="https://wa.me/5592985273076"]').first().getAttribute('href');
          assert.ok(!waText(unknownWa).includes('Vi esta página a partir de'),'Unknown source must not invent attribution');
          const unknownContact=await page.locator('.hero a[href*="contato.html"]').first().getAttribute('href');
          assert.ok(!new URL(unknownContact,page.url()).searchParams.has('src'),'Unknown source must not propagate');

          await page.goto('http://127.0.0.1:8000/index.html?src=reddit-idiomas',{waitUntil:'networkidle'});
          const redditContact=await page.locator('.hero a[href*="contato.html"]').first().getAttribute('href');
          assert.equal(new URL(redditContact,page.url()).searchParams.get('src'),'reddit-idiomas','Reddit source must reach contact intake');

          // Production visual guardrails: one sharp photo plane and finite autonomous geometry.
          const motionCss=fs.readFileSync('assets/professional-motion-v3.css','utf8');
          const motionJs=fs.readFileSync('assets/professional-motion-v3.js','utf8');
          assert.ok(!/blur\s*\(/i.test(motionCss),'Orbit CSS must never blur the photograph');
          assert.ok(!/blur\s*\(/i.test(motionJs),'Orbit JS must never blur the photograph');
          assert.ok(!/cloneNode/i.test(motionJs),'Orbit must never duplicate the photograph');
          assert.ok(!/pointer(move|enter|leave)/i.test(motionJs),'Orbit must not depend on pointer interaction');
          assert.ok(motionJs.includes('assertBaseIntegrity'),'Runtime photograph-integrity guard must exist');
          assert.ok(motionCss.replace(/\s/g,'').includes('prefers-reduced-motion:reduce'),'Reduced motion must be supported');

          const motionCases=[
            {name:'homepage',path:'/index.html',selector:'#ingles-profissional .spatial-orbit-target',count:2,scroll:'#ingles-profissional'},
            {name:'dev',path:'/ingles-para-devs.html',selector:'.professional-visual.spatial-orbit-target',count:1},
            {name:'compliance',path:'/ingles-para-compliance.html',selector:'.professional-visual.spatial-orbit-target',count:1}
          ];
          for(const test of motionCases){
            await page.goto('http://127.0.0.1:8000'+test.path,{waitUntil:'domcontentloaded'});
            if(test.scroll)await page.locator(test.scroll).scrollIntoViewIfNeeded();
            await page.waitForFunction(({selector,count})=>{
              const nodes=[...document.querySelectorAll(selector)];
              return nodes.length===count&&nodes.every(el=>el.dataset.spatialOrbit==='running');
            },{selector:test.selector,count:test.count});
            await page.waitForTimeout(320);
            const during=await page.locator(test.selector).evaluateAll(nodes=>nodes.map(el=>({
              imgs:el.querySelectorAll('img').length,
              frames:el.querySelectorAll('.orbit-frame').length,
              rails:el.querySelectorAll('.orbit-rail').length,
              nodes:el.querySelectorAll('.orbit-node').length,
              halos:el.querySelectorAll('.orbit-halo').length,
              filter:getComputedStyle(el.querySelector(':scope > img')).filter
            })));
            for(const state of during){
              assert.equal(state.imgs,1,`${test.name}: one photograph only`);
              assert.equal(state.frames,3,`${test.name}: three frames expected`);
              assert.equal(state.rails,2,`${test.name}: two rails expected`);
              assert.equal(state.nodes,2,`${test.name}: two nodes expected`);
              assert.equal(state.halos,1,`${test.name}: one halo expected`);
              assert.equal(state.filter,'none',`${test.name}: photograph must stay sharp`);
            }
            await page.waitForFunction(({selector,count})=>{
              const nodes=[...document.querySelectorAll(selector)];
              return nodes.length===count&&nodes.every(el=>el.dataset.spatialOrbit==='done');
            },{selector:test.selector,count:test.count});
            const final=await page.locator(test.selector).evaluateAll(nodes=>nodes.map(el=>({
              integrity:el.dataset.orbitIntegrity,
              imgs:el.querySelectorAll('img').length,
              geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length,
              filter:getComputedStyle(el.querySelector(':scope > img')).filter,
              opacity:getComputedStyle(el.querySelector(':scope > img')).opacity
            })));
            for(const state of final)assert.deepEqual(state,{integrity:'passed',imgs:1,geometry:0,filter:'none',opacity:'1'},`${test.name}: final visual state must be clean`);
            const overflow=await page.evaluate(()=>Math.max(document.body.scrollWidth,document.documentElement.scrollWidth)-window.innerWidth);
            assert.ok(overflow<=2,`${test.name}: no horizontal overflow`);
          }

          // Fail closed if a production image is forcibly blurred.
          await page.goto('http://127.0.0.1:8000/ingles-para-devs.html',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.spatialOrbit==='running');
          await page.locator('.professional-visual.spatial-orbit-target > img').evaluate(img=>img.style.setProperty('filter','blur(2px)','important'));
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.orbitIntegrity==='failed');
          const recovered=await page.locator('.professional-visual.spatial-orbit-target').evaluate(el=>({
            state:el.dataset.spatialOrbit,
            integrity:el.dataset.orbitIntegrity,
            filter:getComputedStyle(el.querySelector(':scope > img')).filter,
            opacity:getComputedStyle(el.querySelector(':scope > img')).opacity,
            geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length
          }));
          assert.deepEqual(recovered,{state:'done',integrity:'failed',filter:'none',opacity:'1',geometry:0},'Blur guard must fail closed and restore clean photograph');

          await page.emulateMedia({reducedMotion:'reduce'});
          await page.goto('http://127.0.0.1:8000/ingles-para-devs.html',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.professional-visual.spatial-orbit-target')?.dataset.spatialOrbit==='done');
          const reduced=await page.locator('.professional-visual.spatial-orbit-target').evaluate(el=>({
            integrity:el.dataset.orbitIntegrity,
            geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length,
            filter:getComputedStyle(el.querySelector(':scope > img')).filter,
            opacity:getComputedStyle(el.querySelector(':scope > img')).opacity
          }));
          assert.deepEqual(reduced,{integrity:'passed',geometry:0,filter:'none',opacity:'1'},'Reduced-motion mode must stay clean');

          await context.close();
          await browser.close();
          console.log('FUNCTIONAL QA OK — format rules, commercial contact, attribution and Spatial Frame Orbit verified');
          EOF
          node functional-check.mjs
