name: Site V3 Visual QA

on:
  push:
    branches: [main, site-v3-redesign]
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'como-funciona.html'
      - 'portal-dos-alunos.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/**'
      - '.github/workflows/site-v3-visual.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'como-funciona.html'
      - 'portal-dos-alunos.html'
      - 'ingles-para-devs.html'
      - 'ingles-para-compliance.html'
      - 'assets/**'
      - '.github/workflows/site-v3-visual.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site-v3-http.log 2>&1 &
          sleep 2
      - name: Render all pages on desktop and mobile
        run: |
          mkdir -p visual-artifacts
          cat > visual-check.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({headless:true});
          const pages = [
            ['home','/index.html'],
            ['formatos','/qual-formato.html'],
            ['como-funciona','/como-funciona.html'],
            ['portal','/portal-dos-alunos.html'],
            ['tecnologia','/ingles-para-devs.html'],
            ['compliance','/ingles-para-compliance.html']
          ];
          const profiles = [
            ['desktop',{viewport:{width:1440,height:900}}],
            ['mobile',{...devices['iPhone 13']}]
          ];
          const report=[];
          for (const [profile,opts] of profiles) {
            const context=await browser.newContext(opts);
            for (const [name,path] of pages) {
              const page=await context.newPage();
              const consoleErrors=[];
              page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
              page.on('pageerror',e=>consoleErrors.push(String(e)));
              await page.goto('http://127.0.0.1:8000'+path,{waitUntil:'networkidle'});

              const initialLayout=await page.evaluate(()=>{
                const header=document.querySelector('.site-header')?.getBoundingClientRect();
                const h1=document.querySelector('h1')?.getBoundingClientRect();
                const gap=(header&&h1)?Math.round(h1.top-header.bottom):null;
                return {
                  headerGap:gap,
                  headerOverlap:gap!==null && gap<8,
                  header:header?{top:Math.round(header.top),bottom:Math.round(header.bottom),h:Math.round(header.height)}:null,
                  h1:h1?{top:Math.round(h1.top),bottom:Math.round(h1.bottom),w:Math.round(h1.width),h:Math.round(h1.height)}:null
                };
              });
              await page.screenshot({path:`visual-artifacts/${name}-${profile}-top.png`,fullPage:false});

              let mobileMenu={required:profile==='mobile',present:true,panelVisible:true,linkCount:null};
              if(profile==='mobile'){
                const menu=page.locator('.mobile-menu');
                mobileMenu.present=await menu.count()===1;
                mobileMenu.panelVisible=false;
                mobileMenu.linkCount=0;
                if(mobileMenu.present){
                  await menu.locator('summary').click();
                  await page.waitForTimeout(70);
                  mobileMenu.panelVisible=await menu.locator('.mobile-menu-panel').isVisible();
                  mobileMenu.linkCount=await menu.locator('.mobile-menu-panel a').count();
                  await page.screenshot({path:`visual-artifacts/${name}-${profile}-menu.png`,fullPage:false});
                  await menu.locator('summary').click();
                }
              }

              const metrics=await page.evaluate(()=>({height:document.documentElement.scrollHeight,viewport:window.innerHeight}));
              const step=Math.max(260,Math.floor(metrics.viewport*.72));
              for(let y=0;y<metrics.height;y+=step){
                await page.evaluate(pos=>window.scrollTo(0,pos),y);
                await page.waitForTimeout(45);
              }
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.waitForTimeout(140);

              await page.screenshot({path:`visual-artifacts/${name}-${profile}.png`,fullPage:true});
              const data=await page.evaluate(()=>{
                const body=document.body;
                const html=document.documentElement;
                const overflow=Math.max(body.scrollWidth,html.scrollWidth)-window.innerWidth;
                const actionable=[...document.querySelectorAll('a.btn,button,nav a,nav summary')];
                const tiny=actionable.filter(el=>{
                  const r=el.getBoundingClientRect();
                  return r.width>0 && r.height>0 && (r.width<36 || r.height<36);
                }).map(el=>({text:(el.textContent||'').trim().slice(0,60),w:Math.round(el.getBoundingClientRect().width),h:Math.round(el.getBoundingClientRect().height)}));
                const hiddenReveal=[...document.querySelectorAll('.reveal-target:not(.is-visible)')].length;
                return {title:document.title,overflowPx:overflow,tinyTargets:tiny,hiddenReveal,documentHeight:Math.round(html.scrollHeight)};
              });
              report.push({name,profile,...data,initialLayout,mobileMenu,consoleErrors});
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-artifacts/report.json',JSON.stringify(report,null,2));
          const failures=report.filter(x=>x.overflowPx>2 || x.consoleErrors.length>0 || x.tinyTargets.length>0 || x.hiddenReveal>0 || x.initialLayout.headerOverlap || (x.mobileMenu.required && (!x.mobileMenu.present || !x.mobileMenu.panelVisible || x.mobileMenu.linkCount<2)));
          console.log(JSON.stringify(report,null,2));
          if(failures.length){
            console.error('VISUAL QA FAILED: overflow, console error, undersized target, unrevealed content, header/H1 collision or mobile navigation failure detected');
            process.exit(1);
          }
          console.log('VISUAL QA OK — all 6 pages checked on desktop/mobile, including layout, overflow, console and mobile navigation');
          EOF
          node visual-check.mjs
      - name: Record and verify autonomous Spatial Frame Orbit evidence
        run: |
          mkdir -p visual-artifacts/motion
          cat > motion-evidence.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'fs';

          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'home',path:'/index.html',selector:'#ingles-profissional .spatial-orbit-target',count:2,scroll:'#ingles-profissional'},
            {name:'dev',path:'/ingles-para-devs.html',selector:'.professional-visual.spatial-orbit-target',count:1},
            {name:'compliance',path:'/ingles-para-compliance.html',selector:'.professional-visual.spatial-orbit-target',count:1}
          ];
          const evidence=[];

          for(const test of cases){
            const context=await browser.newContext({
              viewport:{width:1440,height:900},
              recordVideo:{dir:'visual-artifacts/motion',size:{width:1440,height:900}}
            });
            const page=await context.newPage();
            const consoleErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>consoleErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000'+test.path,{waitUntil:'domcontentloaded'});
            if(test.scroll)await page.locator(test.scroll).scrollIntoViewIfNeeded();
            await page.waitForFunction(({selector,count})=>{
              const targets=[...document.querySelectorAll(selector)];
              return targets.length===count && targets.every(el=>el.dataset.spatialOrbit==='running');
            },{selector:test.selector,count:test.count});
            await page.waitForTimeout(420);

            const during=await page.locator(test.selector).evaluateAll(targets=>targets.map(el=>{
              const img=el.querySelector(':scope > img');
              const cs=getComputedStyle(img);
              return {
                autonomous:el.dataset.orbitAutonomous,
                images:el.querySelectorAll('img').length,
                frames:el.querySelectorAll('.orbit-frame').length,
                rails:el.querySelectorAll('.orbit-rail').length,
                nodes:el.querySelectorAll('.orbit-node').length,
                halo:el.querySelectorAll('.orbit-halo').length,
                filter:cs.filter,
                opacity:Number.parseFloat(cs.opacity)
              }
            }));
            const overflowDuring=await page.evaluate(()=>Math.max(document.body.scrollWidth,document.documentElement.scrollWidth)-window.innerWidth);
            await page.screenshot({path:`visual-artifacts/motion/${test.name}-orbit-during.png`,fullPage:false});

            for(const state of during){
              assert.equal(state.autonomous,'true',`${test.name}: orbit must start autonomously`);
              assert.equal(state.images,1,`${test.name}: photo must not be duplicated`);
              assert.equal(state.frames,3,`${test.name}: three spatial frames expected`);
              assert.equal(state.rails,2,`${test.name}: two rails expected`);
              assert.equal(state.nodes,2,`${test.name}: two nodes expected`);
              assert.equal(state.halo,1,`${test.name}: one temporary halo expected`);
              assert.equal(state.filter,'none',`${test.name}: photograph must stay sharp`);
              assert.ok(state.opacity>=.92,`${test.name}: photograph must stay visibly opaque`);
            }
            assert.ok(overflowDuring<=2,`${test.name}: no horizontal overflow during orbit`);

            await page.waitForFunction(({selector,count})=>{
              const targets=[...document.querySelectorAll(selector)];
              return targets.length===count && targets.every(el=>el.dataset.spatialOrbit==='done');
            },{selector:test.selector,count:test.count});
            const final=await page.locator(test.selector).evaluateAll(targets=>targets.map(el=>{
              const img=el.querySelector(':scope > img');
              const cs=getComputedStyle(img);
              return {integrity:el.dataset.orbitIntegrity,geometry:el.querySelectorAll('.orbit-frame,.orbit-rail,.orbit-node,.orbit-halo').length,filter:cs.filter,opacity:cs.opacity,frame:getComputedStyle(el).transform}
            }));
            for(const state of final){
              assert.equal(state.integrity,'passed',`${test.name}: orbit integrity must pass`);
              assert.equal(state.geometry,0,`${test.name}: temporary geometry must be removed`);
              assert.equal(state.filter,'none',`${test.name}: final photograph must be sharp`);
              assert.equal(state.opacity,'1',`${test.name}: final photograph must be fully visible`);
              assert.equal(state.frame,'none',`${test.name}: frame must return to neutral`);
            }
            assert.equal(consoleErrors.length,0,`${test.name}: console must remain error-free`);
            await page.screenshot({path:`visual-artifacts/motion/${test.name}-orbit-final.png`,fullPage:false});
            evidence.push({name:test.name,during,final,overflowDuring,consoleErrors});

            const video=page.video();
            await page.close();
            const raw=await video.path();
            fs.renameSync(raw,`visual-artifacts/motion/${test.name}-spatial-frame-orbit.webm`);
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-artifacts/motion/spatial-orbit-report.json',JSON.stringify(evidence,null,2));
          console.log('SPATIAL FRAME ORBIT EVIDENCE OK — all four production photographs verified without mouse input');
          EOF
          node motion-evidence.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-v3-visual-evidence
          path: visual-artifacts/
          retention-days: 14