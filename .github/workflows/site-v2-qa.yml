name: Site V2 QA

on:
  push:
    branches: [site-v2-human-search]
  pull_request:
    paths:
      - 'index.html'
      - 'qual-formato.html'
      - 'como-funciona.html'
      - 'portal-dos-alunos.html'
      - 'assets/site-v2.css'
      - 'assets/portal-v2.css'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/site-v2-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate positioning, offer and search basics
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          errors=[]
          pages={name:Path(name).read_text(encoding='utf-8') for name in ['index.html','qual-formato.html','como-funciona.html','portal-dos-alunos.html']}
          home=pages['index.html']; tool=pages['qual-formato.html']
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          robots=Path('robots.txt').read_text(encoding='utf-8')
          canonicals={
            'index.html':'https://teachermarcosvinifs.github.io/Landing-page-1/',
            'qual-formato.html':'https://teachermarcosvinifs.github.io/Landing-page-1/qual-formato.html',
            'como-funciona.html':'https://teachermarcosvinifs.github.io/Landing-page-1/como-funciona.html',
            'portal-dos-alunos.html':'https://teachermarcosvinifs.github.io/Landing-page-1/portal-dos-alunos.html'}
          for name,text in pages.items():
            url=canonicals[name]
            if '<title>' not in text: errors.append(f'{name}: title ausente')
            if 'name="description"' not in text: errors.append(f'{name}: meta description ausente')
            if f'href="{url}"' not in text: errors.append(f'{name}: canonical ausente/incorreto')
            if url not in sitemap: errors.append(f'{name}: URL ausente do sitemap')
            if 'assets/site-v2.css' not in text: errors.append(f'{name}: stylesheet V2 ausente')
          if 'application/ld+json' not in home: errors.append('index.html: dados estruturados ausentes')
          if 'Sitemap: https://teachermarcosvinifs.github.io/Landing-page-1/sitemap.xml' not in robots: errors.append('robots.txt: sitemap canônico ausente')
          if not Path('assets/portal-v2.css').exists(): errors.append('assets/portal-v2.css: ausente')

          required_home=['individual','dupla','trio','grupo','b1','portal dos alunos']
          low=home.lower()
          for term in required_home:
            if term not in low: errors.append(f'index.html: oferta real ausente: {term}')

          forbidden=[r'english mentoring',r'acompanhamento premium',r'experi[eê]ncia premium',r'sem improviso',r'produto de prateleira',r'enfeite de venda',r'se voc[eê] chegou pelo google',r'prepara[cç][aã]o para entrevista',r'roteiro de respostas',r'flu[eê]ncia r[aá]pida',r'm[eé]todo exclusivo',r'transforma[cç][aã]o',r'destravar seu ingl[eê]s',r'dire[cç][aã]o clara']
          for name,text in pages.items():
            for pattern in forbidden:
              if re.search(pattern,text,re.I): errors.append(f'{name}: linguagem proibida/AI-like: {pattern}')

          if 'modalidade conversacional começa a partir do b1' not in low: errors.append('index.html: regra B1+ não está explícita')
          if 'a modalidade conversacional é oferecida a partir do b1' not in pages['como-funciona.html'].lower(): errors.append('como-funciona.html: regra B1+ não está explícita')
          if "individual:{60:280,90:360,120:430}" not in tool: errors.append('qual-formato.html: preços individuais divergentes')
          if "dupla:{60:220,90:280,120:330}" not in tool: errors.append('qual-formato.html: preços dupla divergentes')
          if "trio:{60:190,90:240,120:280}" not in tool: errors.append('qual-formato.html: preços trio divergentes')
          if "grupo:{60:160,90:210,120:250}" not in tool: errors.append('qual-formato.html: preços grupo divergentes')
          if 'isso não é teste de nível' not in tool.lower(): errors.append('qual-formato.html: precisa deixar claro que não é teste de nível')
          for name,text in pages.items():
            if 'wa.me/5592985273076' not in text and name!='portal-dos-alunos.html': errors.append(f'{name}: CTA WhatsApp ausente')

          if errors:
            print('QA FAILED')
            for e in errors: print('-',e)
            sys.exit(1)
          print('QA OK — core pages coerentes com oferta, B1+, mensalidades, SEO e anti-AI copy')
